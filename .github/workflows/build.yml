name: Build and Publish APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build installable APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SignalDashboard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SignalDashboard-installable
          path: SignalDashboard.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" SignalDashboard.apk \
            --title "Signal Dashboard $TAG" \
            --notes "Installable Android APK built automatically from main." \
            --target "${{ github.sha }}"
